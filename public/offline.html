<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillPulse - Offline</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    
    :root {
      --primary-orange: #FF6B35;
      --primary-purple: #8A2BE2;
      --secondary-orange: #FF8E53;
      --secondary-purple: #4A00E0;
      --dark-bg: #1A1A2E;
      --card-bg: rgba(255, 255, 255, 0.1);
      --text-light: #FFFFFF;
      --shadow-color: rgba(138, 43, 226, 0.3);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--dark-bg) 0%, #16213E 100%);
      color: var(--text-light);
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    
    /* Animated background elements */
    .bg-shapes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }
    
    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
      animation: float 15s infinite ease-in-out;
    }
    
    .shape-1 {
      width: 300px;
      height: 300px;
      background: var(--primary-orange);
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }
    
    .shape-2 {
      width: 400px;
      height: 400px;
      background: var(--primary-purple);
      bottom: -150px;
      right: -100px;
      animation-delay: -5s;
    }
    
    .shape-3 {
      width: 200px;
      height: 200px;
      background: var(--secondary-orange);
      top: 50%;
      left: 80%;
      animation-delay: -10s;
    }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-20px) scale(1.05);
      }
    }
    
    .container {
      max-width: 500px;
      padding: 2.5rem;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 15px 35px var(--shadow-color);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      z-index: 1;
      animation: fadeInUp 0.8s ease-out;
    }
    
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--primary-orange), var(--primary-purple));
      z-index: 2;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .icon-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .icon-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-orange), var(--primary-purple));
      animation: rotate 10s linear infinite;
      box-shadow: 0 0 25px var(--shadow-color);
    }
    
    .icon {
      position: relative;
      z-index: 1;
      font-size: 3rem;
      animation: pulse 2s infinite ease-in-out;
    }
    
    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }
    
    h1 {
      margin: 0 0 1.5rem;
      font-size: 2.2rem;
      font-weight: 600;
      background: linear-gradient(to right, var(--primary-orange), var(--primary-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }
    
    p {
      margin: 0 0 2.5rem;
      opacity: 0.9;
      line-height: 1.6;
      font-size: 1.1rem;
      font-weight: 300;
    }
    
    .button-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    
    button {
      background: linear-gradient(135deg, var(--primary-orange), var(--primary-purple));
      border: none;
      color: white;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      box-shadow: 0 5px 15px var(--shadow-color);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: all 0.6s ease;
    }
    
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px var(--shadow-color);
    }
    
    button:hover::before {
      left: 100%;
    }
    
    button:active {
      transform: translateY(1px);
    }
    
    .secondary-btn {
      background: transparent;
      border: 2px solid var(--primary-purple);
      color: var(--text-light);
    }
    
    .connection-status {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      opacity: 0.7;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #FF6B6B;
      animation: blink 2s infinite;
    }
    
    @keyframes blink {
      0%, 50% {
        opacity: 1;
      }
      51%, 100% {
        opacity: 0.3;
      }
    }
    
    /* Responsive adjustments */
    @media (max-width: 600px) {
      .container {
        margin: 1rem;
        padding: 2rem 1.5rem;
      }
      
      h1 {
        font-size: 1.8rem;
      }
      
      .button-container {
        flex-direction: column;
        align-items: center;
      }
      
      button {
        width: 100%;
        max-width: 250px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>
  
  <div class="container">
    <div class="icon-container">
      <div class="icon-bg"></div>
      <div class="icon">📡</div>
    </div>
    <h1>Connection Lost</h1>
    <p>It looks like you're not connected to the internet. Don't worry, you can still browse previously loaded content while we try to restore your connection.</p>
    <div class="button-container">
      <button onclick="window.location.reload()">Try Again</button>
      <button class="secondary-btn" onclick="history.back()">Go Back</button>
    </div>
    <div class="connection-status">
      <div class="status-dot"></div>
      <span>Waiting for network connection...</span>
    </div>
  </div>

  <script>
    // Simple script to check for connection and update status
    window.addEventListener('online', function() {
      document.querySelector('.connection-status span').textContent = 'Connection restored!';
      document.querySelector('.status-dot').style.backgroundColor = '#4ECB71';
    });
    
    window.addEventListener('offline', function() {
      document.querySelector('.connection-status span').textContent = 'Waiting for network connection...';
      document.querySelector('.status-dot').style.backgroundColor = '#FF6B6B';
    });
  </script>
</body>
</html>
